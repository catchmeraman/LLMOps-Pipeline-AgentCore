version: 0.2

env:
  variables:
    ECR_REPO: "bedrock-agentcore-llmops-agent"
    AWS_DEFAULT_REGION: "us-east-1"
    RUNTIME_ID: "llmops_agent-jgErJt74Gu"

phases:
  pre_build:
    commands:
      - echo "Logging in to ECR..."
      - ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_URI

  build:
    commands:
      - echo "Building ARM64 Docker image..."
      - IMAGE_TAG="v1-$(date +%Y%m%d%H%M%S)"
      - docker build -t $ECR_REPO:$IMAGE_TAG .
      - docker tag $ECR_REPO:$IMAGE_TAG $ECR_URI/$ECR_REPO:$IMAGE_TAG
      - docker tag $ECR_REPO:$IMAGE_TAG $ECR_URI/$ECR_REPO:latest
      - docker push $ECR_URI/$ECR_REPO:$IMAGE_TAG
      - docker push $ECR_URI/$ECR_REPO:latest
      - echo "Image pushed: $ECR_URI/$ECR_REPO:$IMAGE_TAG"

  post_build:
    commands:
      - echo "=== Deploying to AgentCore Runtime ==="
      - |
        aws bedrock-agent-runtime update-agent-runtime \
          --agent-runtime-id $RUNTIME_ID \
          --agent-runtime-artifact "{\"containerConfiguration\":{\"containerUri\":\"$ECR_URI/$ECR_REPO:latest\"}}" \
          --region $AWS_DEFAULT_REGION || echo "WARN: update-agent-runtime not available via CLI, using boto3 fallback"
      - |
        python3 -c "
        import boto3, json, sys
        client = boto3.client('bedrock-agentcore', region_name='us-east-1')
        try:
            resp = client.update_agent_runtime(
                agentRuntimeId='${RUNTIME_ID}',
                agentRuntimeArtifact={
                    'containerConfiguration': {
                        'containerUri': '${ECR_URI}/${ECR_REPO}:latest'
                    }
                }
            )
            print(f'AgentCore deploy triggered: {resp[\"agentRuntimeId\"]} status={resp.get(\"agentRuntimeStatus\", \"UPDATING\")}')
        except Exception as e:
            print(f'AgentCore deploy fallback: {e}')
            # If the specific client is not available, try bedrock-agent
            try:
                client2 = boto3.client('bedrock-agent', region_name='us-east-1')
                print('Trying bedrock-agent client...')
            except Exception as e2:
                print(f'Note: AgentCore auto-deploys from :latest ECR tag. Runtime will pick up new image on next invocation.')
        "
      - echo "=== Pipeline Complete ==="
      - echo "Image: $ECR_URI/$ECR_REPO:$IMAGE_TAG"
      - echo "Runtime: $RUNTIME_ID"
